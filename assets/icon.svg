<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="url(#bg)" stroke="#00d4ff" stroke-width="2"/>

  <!-- Simplified eye -->
  <ellipse cx="32" cy="32" rx="20" ry="14" fill="none" stroke="#00d4ff" stroke-width="3"/>
  <circle cx="32" cy="32" r="8" fill="#0066ff" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="32" cy="32" r="4" fill="#00d4ff"/>

  <!-- Highlight -->
  <circle cx="29" cy="30" r="2" fill="#ffffff" opacity="0.9"/>

  <!-- Circuit dots -->
  <rect x="6" y="30" width="4" height="4" fill="#00ff88"/>
  <rect x="54" y="30" width="4" height="4" fill="#00ff88"/>
  <rect x="30" y="6" width="4" height="4" fill="#00ff88"/>
  <rect x="30" y="54" width="4" height="4" fill="#00ff88"/>

  <!-- Scan line -->
  <line x1="14" y1="32" x2="50" y2="32" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0066ff"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
  </defs>

  <!-- Background (rounded square) -->
  <rect x="4" y="4" width="120" height="120" rx="16" fill="url(#bgGrad)" stroke="#00d4ff" stroke-width="2"/>

  <!-- Circuit traces (pixel style) -->
  <g fill="none" stroke="url(#circuitGrad)" stroke-width="3" stroke-linecap="square">
    <!-- Left traces -->
    <path d="M12 40 H24 V48 H32"/>
    <path d="M12 64 H20"/>
    <path d="M12 88 H24 V80 H32"/>

    <!-- Right traces -->
    <path d="M116 40 H104 V48 H96"/>
    <path d="M116 64 H108"/>
    <path d="M116 88 H104 V80 H96"/>

    <!-- Bottom traces -->
    <path d="M48 116 V104 H56"/>
    <path d="M80 116 V104 H72"/>
  </g>

  <!-- Circuit nodes (pixel dots) -->
  <g fill="#00ff88">
    <rect x="10" y="38" width="4" height="4"/>
    <rect x="10" y="62" width="4" height="4"/>
    <rect x="10" y="86" width="4" height="4"/>
    <rect x="114" y="38" width="4" height="4"/>
    <rect x="114" y="62" width="4" height="4"/>
    <rect x="114" y="86" width="4" height="4"/>
    <rect x="46" y="114" width="4" height="4"/>
    <rect x="78" y="114" width="4" height="4"/>
  </g>

  <!-- Eye outer shape (stylized) -->
  <ellipse cx="64" cy="64" rx="36" ry="24" fill="none" stroke="url(#eyeGrad)" stroke-width="4"/>

  <!-- Eye inner ring -->
  <circle cx="64" cy="64" r="16" fill="none" stroke="#00d4ff" stroke-width="3"/>

  <!-- Iris/pupil (pixelated) -->
  <circle cx="64" cy="64" r="10" fill="#0066ff"/>
  <circle cx="64" cy="64" r="6" fill="#00d4ff"/>

  <!-- Scan lines (digital effect) -->
  <g stroke="#00ff88" stroke-width="1" opacity="0.6">
    <line x1="32" y1="56" x2="96" y2="56"/>
    <line x1="36" y1="64" x2="92" y2="64"/>
    <line x1="32" y1="72" x2="96" y2="72"/>
  </g>

  <!-- Highlight/reflection -->
  <circle cx="58" cy="60" r="3" fill="#ffffff" opacity="0.8"/>

  <!-- Corner brackets (targeting) -->
  <g stroke="#00d4ff" stroke-width="2" fill="none">
    <path d="M20 28 L20 20 L28 20"/>
    <path d="M100 20 L108 20 L108 28"/>
    <path d="M108 100 L108 108 L100 108"/>
    <path d="M28 108 L20 108 L20 100"/>
  </g>
</svg>

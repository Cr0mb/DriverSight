<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriverSight Logo Preview</title>
    <style>
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        h1 { color: #00d4ff; }
        .logo-container {
            display: flex;
            gap: 40px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .logo-box {
            background: #0d1b2a;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .logo-box h3 { color: #00ff88; margin-bottom: 15px; }
        canvas { image-rendering: pixelated; }
        button {
            background: #0066ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #00d4ff; }
        .sizes { display: flex; gap: 20px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>DriverSight Logo Assets</h1>

    <div class="logo-container">
        <div class="logo-box">
            <h3>Main Logo (128x128)</h3>
            <canvas id="logo128" width="128" height="128"></canvas>
            <br>
            <button onclick="download('logo128', 'driversight-logo-128.png')">Download PNG</button>
        </div>

        <div class="logo-box">
            <h3>Icon (64x64)</h3>
            <canvas id="icon64" width="64" height="64"></canvas>
            <br>
            <button onclick="download('icon64', 'driversight-icon-64.png')">Download PNG</button>
        </div>

        <div class="logo-box">
            <h3>Icon (32x32)</h3>
            <canvas id="icon32" width="32" height="32"></canvas>
            <br>
            <button onclick="download('icon32', 'driversight-icon-32.png')">Download PNG</button>
        </div>
    </div>

    <div class="sizes">
        <div class="logo-box">
            <h3>Pixel Art (16x16)</h3>
            <canvas id="icon16" width="16" height="16" style="width:64px;height:64px;"></canvas>
            <br>
            <button onclick="download('icon16', 'driversight-icon-16.png')">Download PNG</button>
        </div>
    </div>

    <script>
        function drawLogo(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const s = size / 128; // Scale factor

            // Background gradient
            const bgGrad = ctx.createLinearGradient(0, 0, size, size);
            bgGrad.addColorStop(0, '#1a1a2e');
            bgGrad.addColorStop(1, '#16213e');

            // Rounded rect background
            ctx.beginPath();
            const r = 16 * s;
            ctx.roundRect(4*s, 4*s, 120*s, 120*s, r);
            ctx.fillStyle = bgGrad;
            ctx.fill();
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2 * s;
            ctx.stroke();

            // Circuit traces
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3 * s;
            ctx.lineCap = 'square';

            // Left traces
            ctx.beginPath();
            ctx.moveTo(12*s, 40*s); ctx.lineTo(24*s, 40*s); ctx.lineTo(24*s, 48*s); ctx.lineTo(32*s, 48*s);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(12*s, 64*s); ctx.lineTo(20*s, 64*s);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(12*s, 88*s); ctx.lineTo(24*s, 88*s); ctx.lineTo(24*s, 80*s); ctx.lineTo(32*s, 80*s);
            ctx.stroke();

            // Right traces
            ctx.beginPath();
            ctx.moveTo(116*s, 40*s); ctx.lineTo(104*s, 40*s); ctx.lineTo(104*s, 48*s); ctx.lineTo(96*s, 48*s);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(116*s, 64*s); ctx.lineTo(108*s, 64*s);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(116*s, 88*s); ctx.lineTo(104*s, 88*s); ctx.lineTo(104*s, 80*s); ctx.lineTo(96*s, 80*s);
            ctx.stroke();

            // Circuit nodes
            ctx.fillStyle = '#00ff88';
            const nodes = [[10,38],[10,62],[10,86],[114,38],[114,62],[114,86],[46,114],[78,114]];
            nodes.forEach(([x,y]) => ctx.fillRect(x*s, y*s, 4*s, 4*s));

            // Eye outer ellipse
            ctx.beginPath();
            ctx.ellipse(64*s, 64*s, 36*s, 24*s, 0, 0, Math.PI * 2);
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 4 * s;
            ctx.stroke();

            // Eye inner ring
            ctx.beginPath();
            ctx.arc(64*s, 64*s, 16*s, 0, Math.PI * 2);
            ctx.lineWidth = 3 * s;
            ctx.stroke();

            // Iris
            ctx.beginPath();
            ctx.arc(64*s, 64*s, 10*s, 0, Math.PI * 2);
            ctx.fillStyle = '#0066ff';
            ctx.fill();

            // Pupil
            ctx.beginPath();
            ctx.arc(64*s, 64*s, 6*s, 0, Math.PI * 2);
            ctx.fillStyle = '#00d4ff';
            ctx.fill();

            // Highlight
            ctx.beginPath();
            ctx.arc(58*s, 60*s, 3*s, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fill();

            // Scan lines
            ctx.strokeStyle = 'rgba(0,255,136,0.6)';
            ctx.lineWidth = 1 * s;
            [[32,56,96,56],[36,64,92,64],[32,72,96,72]].forEach(([x1,y1,x2,y2]) => {
                ctx.beginPath();
                ctx.moveTo(x1*s, y1*s);
                ctx.lineTo(x2*s, y2*s);
                ctx.stroke();
            });

            // Corner brackets
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2 * s;
            ctx.beginPath();
            ctx.moveTo(20*s, 28*s); ctx.lineTo(20*s, 20*s); ctx.lineTo(28*s, 20*s);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(100*s, 20*s); ctx.lineTo(108*s, 20*s); ctx.lineTo(108*s, 28*s);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(108*s, 100*s); ctx.lineTo(108*s, 108*s); ctx.lineTo(100*s, 108*s);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(28*s, 108*s); ctx.lineTo(20*s, 108*s); ctx.lineTo(20*s, 100*s);
            ctx.stroke();
        }

        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const s = size / 64;

            // Background
            const bgGrad = ctx.createLinearGradient(0, 0, size, size);
            bgGrad.addColorStop(0, '#1a1a2e');
            bgGrad.addColorStop(1, '#0d1b2a');

            ctx.beginPath();
            ctx.roundRect(2*s, 2*s, 60*s, 60*s, 10*s);
            ctx.fillStyle = bgGrad;
            ctx.fill();
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2 * s;
            ctx.stroke();

            // Eye ellipse
            ctx.beginPath();
            ctx.ellipse(32*s, 32*s, 20*s, 14*s, 0, 0, Math.PI * 2);
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 3 * s;
            ctx.stroke();

            // Iris
            ctx.beginPath();
            ctx.arc(32*s, 32*s, 8*s, 0, Math.PI * 2);
            ctx.fillStyle = '#0066ff';
            ctx.fill();
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2 * s;
            ctx.stroke();

            // Pupil
            ctx.beginPath();
            ctx.arc(32*s, 32*s, 4*s, 0, Math.PI * 2);
            ctx.fillStyle = '#00d4ff';
            ctx.fill();

            // Highlight
            ctx.beginPath();
            ctx.arc(29*s, 30*s, 2*s, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fill();

            // Circuit dots
            ctx.fillStyle = '#00ff88';
            [[6,30],[54,30],[30,6],[30,54]].forEach(([x,y]) => ctx.fillRect(x*s, y*s, 4*s, 4*s));

            // Scan line
            ctx.strokeStyle = 'rgba(0,255,136,0.5)';
            ctx.lineWidth = 1 * s;
            ctx.beginPath();
            ctx.moveTo(14*s, 32*s);
            ctx.lineTo(50*s, 32*s);
            ctx.stroke();
        }

        function download(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Draw all logos
        drawLogo('logo128', 128);
        drawIcon('icon64', 64);
        drawIcon('icon32', 32);
        drawIcon('icon16', 16);
    </script>
</body>
</html>
